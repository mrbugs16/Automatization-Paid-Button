[pytest]
testpaths = tests
pythonpath = .
addopts = -v -s -p no:cacheprovider
markers =
    caso(id, **meta): vincula la prueba con un caso de la matriz (TC-BP-xxx)
    gobierno: precondición en el portal del Gobierno de Puebla (fuera de alcance)
    memphis: flujo del Botón de Pago Memphis (alcance QA)
    pago: la prueba confirma un pago real en el ambiente (usa la tarjeta y puede consumir el link)
    lento: espera a propósito varios minutos (vida del token o del 3DS)
